<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-Based Early Detection of At-Risk Students</title>
<style>
:root{
  --bg:#f5f3ff; --card:#ffffff; --ink:#191035; --sub:#6b6285; --line:#e7e1fb;
  --blue:#6d28d9; --blue-soft:#efe8ff;
  --red:#e11d48; --red-soft:#ffe4ec;
  --amber:#ea8c00; --amber-soft:#fff2dc;
  --green:#0d9488; --green-soft:#dcfaf3;
  --navy:#1e0a4d;
  --grad1:#7c3aed; --grad2:#db2777; --grad3:#f59e0b;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --card:#121a2b; --ink:#eef2f9; --sub:#96a3b8; --line:#233047;
    --blue-soft:#16223f; --red-soft:#2a1615; --amber-soft:#2a2011; --green-soft:#12261c;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#121a2b; --ink:#eef2f9; --sub:#96a3b8; --line:#233047;
  --blue-soft:#16223f; --red-soft:#2a1615; --amber-soft:#2a2011; --green-soft:#12261c;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,Roboto,sans-serif;}
.app{display:flex;min-height:100vh;max-width:100%;overflow-x:hidden}
.hide{display:none!important}
/* Sidebar */
.side{width:230px;flex:0 0 230px;background:linear-gradient(200deg,#2a0e6e 0%,#1e0a4d 55%,#4c0a63 100%);color:#e6ddff;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.side h1{font-size:16px;font-weight:700;color:#fff;margin:0}
.side p{font-size:11px;color:#b7a4e8;margin:2px 0 14px}
.side .role{font-size:12px;color:#c9b8f2;margin-bottom:8px}
.navbtn{background:none;border:none;color:#d3c5f7;text-align:left;padding:9px 10px;border-radius:8px;font-size:13.5px;cursor:pointer}
.navbtn:hover{background:rgba(255,255,255,.08)}
.navbtn.active{background:linear-gradient(90deg,#7c3aed,#db2777);color:#fff;font-weight:600}
.side .spacer{flex:1}
.logout{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#e6ddff;padding:9px;border-radius:8px;cursor:pointer;font-size:13px}
.foot-note{font-size:10.5px;color:#a996d6;margin-top:10px;line-height:1.5}
/* Main */
.main{flex:1;min-width:0;padding:26px 30px 60px;overflow-x:hidden}
.hero-title{font-size:27px;font-weight:800;margin:0 0 3px;background:linear-gradient(90deg,var(--grad1),var(--grad2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{color:var(--sub);font-size:14px;margin:0 0 22px}
.section-title{font-size:17px;font-weight:700;margin:26px 0 12px}
.grid{display:grid;gap:14px}
.grid.cols-5{grid-template-columns:repeat(5,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.grid.cols-2{grid-template-columns:1fr 1fr}
@media(max-width:900px){.grid.cols-5,.grid.cols-4{grid-template-columns:repeat(2,1fr)}.grid.cols-2{grid-template-columns:1fr}.side{width:190px;flex-basis:190px}.main{padding:18px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 6px 18px rgba(109,40,217,.06)}
.metric-label{font-size:12px;color:var(--sub);font-weight:600}
.metric-value{font-size:26px;font-weight:800;margin-top:6px;background:linear-gradient(90deg,var(--grad1),var(--grad2));-webkit-background-clip:text;background-clip:text;color:transparent}
.metric-note{font-size:11.5px;color:var(--sub);margin-top:4px}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700}
.badge.danger{background:var(--red-soft);color:var(--red)}
.badge.warn{background:var(--amber-soft);color:var(--amber)}
.badge.watch{background:var(--blue-soft);color:var(--blue)}
.badge.ok{background:var(--green-soft);color:var(--green)}
.blue-panel{background:linear-gradient(135deg,#eef3ff,#e4ecff);border:1px solid #c9d9ff;border-radius:14px;padding:18px}
.blue-panel .metric-card2{background:#fff;border:1px solid #d3e0ff;border-radius:12px;padding:14px}
.blue-panel .metric-label{color:#2955d6}
.blue-panel .metric-value{background:none;-webkit-text-fill-color:initial;color:#1e3a8a;font-size:22px}
.att-log{max-height:260px;overflow-y:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
.topbar .crumb{font-size:12.5px;color:var(--sub);font-weight:600}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:9px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.icon-btn:hover{background:var(--blue-soft)}
@media print{
  .side,.topbar,.chip-row,#dir-search,input[type=range],button{display:none!important}
  .main{padding:0}
  body{background:#fff}
  .card{box-shadow:none;break-inside:avoid}
}
.info{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.info b{display:block;margin-bottom:5px;font-size:13.5px}
.info p{margin:0;font-size:13px;color:var(--sub);line-height:1.55}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--sub);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
tr:hover td{background:var(--blue-soft)}
.row-flex{display:flex;align-items:center;gap:10px}
.btn{background:linear-gradient(90deg,var(--grad1),var(--grad2));color:#fff;border:none;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:12.5px}
select,textarea,input[type=range]{font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--card);color:var(--ink)}
textarea{width:100%;resize:vertical}
/* Login */
@keyframes floatBg{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-3%,2%) scale(1.05)}100%{transform:translate(0,0) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
body.login-body{min-height:100vh;position:relative;overflow-x:hidden;background:#120833}
body.login-body::before{content:"";position:fixed;inset:-10%;background:
  radial-gradient(38% 32% at 15% 20%,rgba(124,58,237,.55),transparent 60%),
  radial-gradient(35% 30% at 85% 15%,rgba(219,39,119,.5),transparent 60%),
  radial-gradient(40% 35% at 50% 90%,rgba(245,158,11,.35),transparent 60%),
  #120833;
  animation:floatBg 14s ease-in-out infinite; z-index:0}
.login-wrap{position:relative;z-index:1;max-width:920px;margin:0 auto;text-align:center;padding:64px 20px 40px;animation:rise .6s ease}
.eyebrow-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#e9d8ff;padding:6px 14px;border-radius:999px;font-size:12.5px;backdrop-filter:blur(6px)}
.eyebrow-pill span.dot{width:7px;height:7px;border-radius:50%;background:#22d3ee;box-shadow:0 0 8px #22d3ee}
.login-title{font-size:44px;line-height:1.12;font-weight:800;color:#fff;margin:22px 0 12px;letter-spacing:-.5px}
.login-title em{font-style:normal;background:linear-gradient(90deg,#a78bfa,#f472b6,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-sub{color:#cabdea;margin-top:8px;font-size:16px;max-width:560px;margin-left:auto;margin-right:auto;line-height:1.6}
.stat-strip{display:flex;justify-content:center;gap:34px;margin-top:30px;flex-wrap:wrap}
.stat-strip .stat b{display:block;font-size:22px;font-weight:800;color:#fff}
.stat-strip .stat span{font-size:12px;color:#b6a5da}
.roles{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:38px auto 0;max-width:920px}
@media(max-width:700px){.roles{grid-template-columns:1fr}.login-title{font-size:32px}.stat-strip{gap:20px}}
.role-card{background:rgba(255,255,255,.06);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:26px 20px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.25);transition:transform .18s,background .18s}
.role-card:hover{transform:translateY(-6px);background:rgba(255,255,255,.1)}
.role-icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff}
.role-card:nth-child(1) .role-icon{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.role-card:nth-child(2) .role-icon{background:linear-gradient(135deg,#db2777,#f472b6)}
.role-card:nth-child(3) .role-icon{background:linear-gradient(135deg,#f59e0b,#fbbf24)}
.role-card h3{margin:4px 0 6px;font-size:16.5px;color:#fff}
.role-card p{font-size:13px;color:#c7bbe3;margin:0 0 16px;line-height:1.5}
.role-card .btn{width:100%;background:#fff;color:#241148;box-shadow:none}
.role-card .btn:hover{background:#f2ebff}
.role-card h3{margin:4px 0 6px;font-size:16px}
.role-card p{font-size:13px;color:var(--sub);margin:0 0 14px}
.timeline{border-left:4px solid var(--blue);background:var(--card);border-radius:0 10px 10px 0;padding:11px 15px;margin-bottom:9px;font-size:13.5px}
.timeline b{display:block;font-size:12.5px;color:var(--blue);margin-bottom:2px}
svg text{font-family:inherit}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;cursor:pointer;background:var(--card)}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
/* ---------- DATA ---------- */
const SUBJECTS = ["Mathematics","Science","English","Social Studies","Computer Science"];
const PERSONAS = {
  "Steady":       {att:[86,94], quiz:[78,90], slope:[-0.2,0.2]},
  "Gradual Decliner": {att:[82,90], quiz:[78,86], slope:[-1.8,-1.0]},
  "Sudden Drop":  {att:[86,93], quiz:[80,88], slope:[0,0]},
  "Chronic Absentee": {att:[56,68], quiz:[64,76], slope:[-0.5,0.1]},
  "Recovering":   {att:[68,75], quiz:[58,68], slope:[1.0,2.0]}
};
const NAMES = ["Aarav Kumar","Ananya Reddy","Rahul Verma","Saanvi Rao","Arjun Singh","Diya Sharma","Vihaan Patel","Myra Das","Aditya Kumar","Ishita Rao","Rohan Gupta","Aadhya Singh","Kabir Reddy","Meera Patel","Ayaan Khan","Sara Verma","Nikhil Rao","Anika Sharma","Ishaan Kumar","Kiara Das","Dev Reddy","Navya Singh","Aryan Patel","Tara Rao","Reyansh Kumar","Ira Verma","Karthik Sharma","Riya Reddy","Manav Gupta","Avni Singh","Siddharth Rao","Aanya Patel","Ritvik Kumar","Shreya Sharma","Yash Verma","Pihu Reddy","Atharv Singh","Nandini Rao","Krishna Patel","Mahi Kumar","Varun Das","Aarohi Sharma","Harsh Reddy","Ishani Verma","Rudra Singh","Tanvi Rao","Advik Patel","Om Sharma","Kavya Reddy","Dhruv Singh"];
const FATHER_FIRST = ["Suresh","Ramesh","Mahesh","Rajesh","Prakash","Vijay","Anil","Sanjay","Vinod","Ashok"];
const PATTERN = ["Steady","Steady","Gradual Decliner","Steady","Chronic Absentee","Steady","Sudden Drop","Steady","Recovering","Steady"];
const PLIST = NAMES.map((_,i)=>PATTERN[i%PATTERN.length]);
function synthPhone(i){ return "9"+String(700000000+i*137931).slice(0,9); }

// Seeded RNG to mirror app.py's rng = np.random.default_rng(42)
let __seed = 42;
function __rand(){
  __seed += 0x6D2B79F5;
  let t = __seed;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function rnd(a,b){return a+__rand()*(b-a);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

let students = [];
NAMES.forEach((name,i)=>{
  const persona = PLIST[i];
  const p = PERSONAS[persona];
  const baseAtt = rnd(p.att[0],p.att[1]);
  const baseQuiz = rnd(p.quiz[0],p.quiz[1]);
  const attSlope = rnd(p.slope[0],p.slope[1]);
  const quizSlope = rnd(p.slope[0],p.slope[1]);
  let weeks=[];
  for(let w=1; w<=8; w++){
    let att,quiz,missing=0;
    if(persona==="Sudden Drop" && w>=6){ att=baseAtt-rnd(8,17); quiz=baseQuiz-rnd(20,32); missing=Math.floor(rnd(1,4)); }
    else{
      att = baseAtt+attSlope*(w-1)+rnd(-1.5,1.5);
      quiz = baseQuiz+quizSlope*(w-1)+rnd(-2,2);
      if(persona==="Chronic Absentee") missing=Math.floor(rnd(1,4));
      else if(persona==="Gradual Decliner" && w>=5) missing=Math.floor(rnd(1,3));
      else missing=Math.floor(rnd(0,2));
    }
    weeks.push({week:w, att:clamp(att,45,99), quiz:clamp(quiz,30,99), missing});
  }
  const subj = {};
  SUBJECTS.forEach(s=>{
    let adj = rnd(-8,8);
    if(s==="Mathematics" && (persona==="Gradual Decliner"||persona==="Sudden Drop")) adj -= 7;
    subj[s] = {marks: clamp(weeks[7].quiz+adj,35,98), att: clamp(weeks[7].att+rnd(-6,4),45,99)};
  });
  const examAtt = clamp(weeks[7].att + rnd(-6,4), 40, 99);
  const specialAtt = clamp(weeks[7].att + rnd(-10,6), 35, 99);
  const dailyLog = [];
  let dPtr = new Date(2026,7,3);
  while(dailyLog.length < 20){
    if(dPtr.getDay()!==0 && dPtr.getDay()!==6){
      const p = weeks[7].att/100;
      let status = Math.random()<p ? "Present" : "Absent";
      if(status==="Present" && Math.random()<0.08) status="Late";
      dailyLog.push({date:new Date(dPtr), status});
    }
    dPtr = new Date(dPtr.getTime()+86400000);
  }
  students.push({id:"STU-"+String(i+1).padStart(3,"0"), name, cls:"VIII-A", persona, weeks, subj,
    father: FATHER_FIRST[i%FATHER_FIRST.length]+" "+name.split(" ")[1], phone: synthPhone(i),
    examAtt, specialAtt, dailyLog});
});

function slope(vals){
  const n=vals.length; const xs=vals.map((_,i)=>i+1);
  const mx=xs.reduce((a,b)=>a+b)/n, my=vals.reduce((a,b)=>a+b)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){num+=(xs[i]-mx)*(vals[i]-my); den+=(xs[i]-mx)**2;}
  return den===0?0:num/den;
}
function calcRisk(st){
  const attArr=st.weeks.map(w=>w.att), quizArr=st.weeks.map(w=>w.quiz);
  const attSlope=slope(attArr), quizSlope=slope(quizArr);
  const lastAtt=attArr[7], lastQuiz=quizArr[7];
  const attFactor=clamp((-attSlope*8)+((85-lastAtt)*0.65),0,100);
  const quizFactor=clamp((-quizSlope*8)+((70-lastQuiz)*1.4),0,100);
  const missing=st.weeks.slice(-3).reduce((a,w)=>a+w.missing,0);
  const assignFactor=clamp(missing/6*100,0,100);
  const attLevelFactor=clamp((85-lastAtt)*1.7,0,100);
  const risk=Math.round((attFactor*0.35+quizFactor*0.30+assignFactor*0.20+attLevelFactor*0.15)*10)/10;
  let status = risk>=70?"Needs Support":risk>=55?"Monitor Closely":risk>=35?"Watch":"On Track";
  return {risk,status,attSlope,quizSlope,lastAtt,lastQuiz,missing,attFactor,quizFactor,assignFactor,attLevelFactor};
}
function weakSubject(st){
  return Object.entries(st.subj).sort((a,b)=>a[1].marks-b[1].marks)[0][0];
}
function badgeClass(status){
  return status==="Needs Support"?"danger":status==="Monitor Closely"?"warn":status==="Watch"?"watch":"ok";
}

/* ---------- STATE ---------- */
let state = {loggedIn:false, role:null, page:null, selected: students[0].id, subject: SUBJECTS[0], sent:false, dirFilter:"All"};

/* ---------- SVG CHART HELPERS ---------- */
function lineChart(series, w=560, h=220){
  const pad={l:34,r:14,t:14,b:24};
  const iw=w-pad.l-pad.r, ih=h-pad.t-pad.b;
  const n=series[0].data.length;
  const x=i=>pad.l+iw*(i/(n-1));
  const y=v=>pad.t+ih*(1-v/100);
  let s = `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:100%">`;
  [0,25,50,75,100].forEach(v=>{
    s+=`<line x1="${pad.l}" y1="${y(v)}" x2="${w-pad.r}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="4" y="${y(v)+4}" font-size="10" fill="var(--sub)">${v}</text>`;
  });
  const colors=["#7c3aed","#0d9488"];
  series.forEach((ser,si)=>{
    let d="";
    ser.data.forEach((v,i)=>{ d+= (i===0?"M":"L")+x(i)+","+y(v)+" "; });
    s+=`<path d="${d}" fill="none" stroke="${colors[si]}" stroke-width="2.5"/>`;
    ser.data.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${colors[si]}"/>`; });
  });
  s+=`</svg>`;
  let legend = series.map((ser,i)=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:12px;color:var(--sub)"><span style="width:10px;height:10px;background:${colors[i]};border-radius:2px;display:inline-block"></span>${ser.name}</span>`).join("");
  return `<div>${s}<div style="margin-top:4px">${legend}</div></div>`;
}
function barChartH(items, w=520){
  const maxV = Math.max(...items.map(i=>i.value), 1);
  let rows = items.map(it=>{
    const pct = (it.value/maxV*100).toFixed(1);
    return `<div style="margin-bottom:10px"><div style="font-size:12.5px;color:var(--sub);margin-bottom:3px">${it.label}</div>
    <div style="background:var(--line);border-radius:6px;height:16px;overflow:hidden"><div style="width:${pct}%;background:linear-gradient(90deg,#7c3aed,#db2777);height:100%;border-radius:6px"></div></div></div>`;
  }).join("");
  return `<div>${rows}</div>`;
}
function barChartV(items){
  const maxV = Math.max(...items.map(i=>i.value),1);
  const w=440,h=200,pad=30;
  const bw = (w-pad*2)/items.length*0.6;
  const gap=(w-pad*2)/items.length;
  const barColors=["#0d9488","#6d28d9","#ea8c00","#e11d48"];
  let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:100%">`;
  items.forEach((it,i)=>{
    const bh=(it.value/maxV)*(h-50);
    const x=pad+gap*i+(gap-bw)/2;
    const y=h-30-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${barColors[i%barColors.length]}" rx="6"/>`;
    s+=`<text x="${x+bw/2}" y="${h-14}" font-size="10.5" fill="var(--sub)" text-anchor="middle">${it.label}</text>`;
    s+=`<text x="${x+bw/2}" y="${y-6}" font-size="11" fill="var(--ink)" text-anchor="middle" font-weight="700">${it.value}</text>`;
  });
  s+=`</svg>`;
  return s;
}

/* ---------- RENDER ---------- */
function render(){
  const app = document.getElementById("app");
  if(!state.loggedIn){ document.body.classList.add("login-body"); app.innerHTML = loginView(); attachLogin(); return; }
  document.body.classList.remove("login-body");
  app.innerHTML = `<div class="side">${sidebarView()}</div><div class="main">${topbarView()}${pageView()}</div>`;
  attachMain();
}
function topbarView(){
  let dark=false; try{ dark = localStorage.getItem('theme')==='dark'; }catch(e){}
  return `<div class="topbar">
    <span class="crumb">${state.role} &nbsp;/&nbsp; ${state.page}</span>
    <div style="display:flex;gap:8px">
      <div class="icon-btn" id="theme-toggle" title="Toggle dark mode">${dark? "☀️" : "🌙"}</div>
      <div class="icon-btn" id="export-btn" title="Export / Print report">⤓</div>
    </div>
  </div>`;
}
function applyTheme(){
  try{
    const t = localStorage.getItem('theme');
    if(t==='dark') document.documentElement.setAttribute('data-theme','dark');
  }catch(e){}
}
applyTheme();

function loginView(){
  const supportCount = students.filter(s=>calcRisk(s).status!=="On Track").length;
  return `<div class="login-wrap">
    <span class="eyebrow-pill"><span class="dot"></span>AI-Powered · Early Warning System</span>
    <div class="login-title">AI-Based Early Detection<br><em>of At-Risk Students</em></div>
    <div class="login-sub">An explainable early-detection engine that reads attendance, assessments and assignment patterns to flag students who need support — weeks before report cards do.</div>
    <div class="stat-strip">
      <div class="stat"><b>${students.length}</b><span>Students monitored</span></div>
      <div class="stat"><b>${SUBJECTS.length}</b><span>Subjects tracked</span></div>
      <div class="stat"><b>${supportCount}</b><span>Signals flagged this term</span></div>

function metricCard(label,value,note){
  return `<div class="card"><div class="metric-label">${label}</div><div class="metric-value">${value}</div><div class="metric-note">${note}</div></div>`;
}

function getReasons(st,r){
  const reasons=[];
  if(r.lastAtt<75) reasons.push(`Attendance is currently ${r.lastAtt.toFixed(0)}%.`);
  if(r.attSlope<-0.7) reasons.push("Attendance has been declining across recent weeks.");
  if(r.lastQuiz<60) reasons.push(`Recent assessment performance is ${r.lastQuiz.toFixed(0)}%.`);
  if(r.quizSlope<-0.7) reasons.push("Assessment performance is trending downward.");
  if(r.missing>=3) reasons.push(`${r.missing} assignments were missed in the recent period.`);
  if(!reasons.length) reasons.push("Current indicators are relatively stable.");
  return reasons;
}

function trackPage(){
  const st = students.find(s=>s.id===state.selected);
  const risks = [];
  for(let w=1; w<=8; w++){
    const h = st.weeks.slice(0,w);
    if(h.length<2){ risks.push(25); continue; }
    const attS=slope(h.map(x=>x.att)), quizS=slope(h.map(x=>x.quiz));
    const lastAtt=h[h.length-1].att, lastQuiz=h[h.length-1].quiz;
    const v = clamp((-attS*8)+((85-lastAtt)*0.65),0,100)*0.35 + clamp((-quizS*8)+((70-lastQuiz)*1.4),0,100)*0.30;
    risks.push(clamp(v,0,100));
  }
  const r = calcRisk(st);
  const weak = weakSubject(st);
  const first = st.weeks[0], last = st.weeks[7];
  const timeline = [
    ["Week 1","Baseline academic data recorded."],
    ["Week 3","Attendance and assessment trends monitored."],
    ["Week 5","Emerging support signal identified."],
    ["Week 6","Targeted intervention recommended."],
    ["Week 7","Parent communication and special class recommended."],
    ["Week 8","Progress reviewed."]
  ];
  return `
  <div class="hero-title">Progress Tracking</div>
  <div class="hero-sub">Track academic signals before and after support activities — ${st.name}.</div>
  <div class="card">${lineChart([{name:"Risk Signal",data:risks}])}</div>
  <div class="section-title">Academic recovery indicators</div>
  <div class="grid cols-4">
    ${metricCard("Attendance",last.att.toFixed(0)+"%",(last.att-first.att>=0?"+":"")+(last.att-first.att).toFixed(0)+" pts")}
    ${metricCard("Assessment",last.quiz.toFixed(0)+"%",(last.quiz-first.quiz>=0?"+":"")+(last.quiz-first.quiz).toFixed(0)+" pts")}
    ${metricCard("Weak Subject",weak,"")}
    ${metricCard("Current Status",r.status,"")}
  </div>
  <div class="section-title">Support timeline</div>
  ${timeline.map(([w,t])=>`<div class="timeline"><b>${w}</b>${t}</div>`).join("")}
  <div class="info" style="margin-top:12px"><p>This prototype uses synthetic data. The progress visualization shows how a school could track indicators over time; it does not establish that an intervention caused a particular outcome.</p></div>
  <button class="btn ghost" id="back-teacher" style="margin-top:8px">← Back to dashboard</button>`;
}

    });
  };
  document.querySelectorAll(".dir-filter").forEach(c=>c.onclick=()=>{state.dirFilter=c.dataset.f; render();});
  const themeBtn = document.getElementById("theme-toggle");
  if(themeBtn) themeBtn.onclick=()=>{
    try{
      const cur = localStorage.getItem('theme')==='dark' ? 'light' : 'dark';
      localStorage.setItem('theme', cur);
      if(cur==='dark') document.documentElement.setAttribute('data-theme','dark');
      else document.documentElement.removeAttribute('data-theme');
    }catch(e){}
    render();
  };
  const exportBtn = document.getElementById("export-btn");
  if(exportBtn) exportBtn.onclick=()=>window.print();
  const back = document.getElementById("back-teacher");
  if(back) back.onclick=()=>{state.page="Dashboard"; render();};
  const slider = document.getElementById("time-slider");
  if(slider){
    const updateTime=()=>{
      const st = students.find(s=>s.id===state.selected);
      const w = st.weeks[slider.value-1];
      document.getElementById("time-metrics").innerHTML =
        metricCard("Attendance",w.att.toFixed(0)+"%","")+
        metricCard("Assessment",w.quiz.toFixed(0)+"%","")+
        metricCard("Missing Assignments",w.missing,"")+ "<div></div>";
      document.getElementById("time-note").textContent = slider.value<8 ? "This replay shows an earlier point in the student's academic history." : "Current period selected.";
    };
    slider.oninput = updateTime; updateTime();
  }
  const subjSel = document.getElementById("subject-select");
  if(subjSel) subjSel.onchange=()=>{state.subject=subjSel.value; render();};
  const sendBtn = document.getElementById("send-parent");
  if(sendBtn) sendBtn.onclick=()=>{state.sent=true; document.getElementById("parent-sent").innerHTML='<div class="badge ok">Parent update sent (demo mode)</div>';};
  const explainBtn = document.getElementById("explain-btn");
  if(explainBtn) explainBtn.onclick=()=>{document.getElementById("student-msg").innerHTML='<div class="badge ok">Learning support opened.</div>';};
  const practiceBtn = document.getElementById("practice-btn");
  if(practiceBtn) practiceBtn.onclick=()=>{document.getElementById("student-msg").innerHTML='<div class="badge ok">Practice set opened.</div>';};
}

render();
</script>
</body>
</html>
